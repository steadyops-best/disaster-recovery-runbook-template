name: Test and Release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile tools/dr_readiness_score.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/dr_readiness_score.py examples/readiness.json --threshold 0 --output /tmp/report.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar -czf disaster-recovery-runbook-kit.tar.gz README.md templates tools examples LICENSE CITATION.cff
          sha256sum disaster-recovery-runbook-kit.tar.gz > disaster-recovery-runbook-kit.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            disaster-recovery-runbook-kit.tar.gz
            disaster-recovery-runbook-kit.tar.gz.sha256
